name: Build WorkSuite Office (macOS)

# Euro-Office has no macOS build. The macOS app is the ONLYOFFICE Xcode project
# (desktop-apps/macos, rebranded in our fork) linked against the ONLYOFFICE core,
# editors and SDK of the same version, built with ONLYOFFICE build_tools.
#
# 10.0: the editors are ONLYOFFICE's v10 tags. ONLYOFFICE's public build_tools stops at 9.4
# (BUILD_TOOLS_REF), and its start page build still runs Grunt, which the v10 start page (Vite)
# no longer has: the start page is built here first, so build_tools finds deploy/index.html.

# Updates: the app's Sparkle reads its feed from the Update Center (download.worksuitecloud.com,
# worksite-download docs/sparkle.md). This build stamps the feed's channel, a rising CFBundleVersion and
# WorkSuite's Sparkle public key (repository variable SPARKLE_PUBLIC_ED_KEY) into the app, and signs the
# DMG with the private key (secret SPARKLE_ED_PRIVATE_KEY) into <dmg>.edsig, which
# scripts/publish-release.mjs in worksite-download puts into the release's attestation.
#
# Architectures (UPD-07, G-14): one job per architecture, arm64 on Apple silicon and x64 on an Intel runner,
# each a DMG of its own with its own feed (?arch=arm64 / ?arch=x64); publish.yml uploads both.
#
# Code signing (UPD-06, NFR-08, G-03): with the MACOS_CERTIFICATE_P12 secret (and its password) the app is
# built with that Developer ID Application identity and the hardened runtime, the DMG is signed, and with
# the notary secrets (MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID, MACOS_NOTARY_ISSUER) it is notarised with
# notarytool and stapled. Without them the build is ad-hoc signed as before, with a warning, and only the
# beta channel takes it. Secret names: build/README.md, "Signing and updates".

on:
  # a new workflow can only be dispatched once it is on the default branch: until then, pushes to office-v10 run it
  push:
    branches: [office-v10]
    paths: ['.github/workflows/build-mac.yml', 'build/v10/**', 'sinhala/**', 'ai-service/**', 'ai-plugin/**']
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel the app follows. Beta until builds are Developer ID signed and notarised, which Stable requires.
        type: choice
        options: [beta, stable]
        default: beta
      build_number:
        description: Build number, the app's CFBundleVersion. It must rise with every release on a channel; empty means 1000 + this workflow's run number.
        required: false
        default: ''

env:
  OO_TAG: v10.0.0.176
  BUILD_TOOLS_REF: release/v9.4.0
  BUILD_TOOLS_SHA: cf4cac0846d03e2e00a6fec5d1ecd4e9463086d5
  # desktop-apps' v10 branch, the same commit as the Windows and Linux 10 builds
  DESKTOP_APPS_REF: cbbb62320881f47f03e02317ea54d4a4f90df39d
  PRODUCT_VERSION: 10.1.15
  COMPANY_NAME: WorkSuite
  UPDATE_CENTER: https://download.worksuitecloud.com
  UPDATE_APP_ID: lk.worksuite.office

jobs:
  build-mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-14
            platform: mac_arm64
            scheme: ONLYOFFICE-arm
          - arch: x64
            runner: macos-15-intel
            platform: mac_64
            scheme: ONLYOFFICE-x86_64
    runs-on: ${{ matrix.runner }}
    env:
      ARCH: ${{ matrix.arch }}
      OO_PLATFORM: ${{ matrix.platform }}
      SCHEME: ${{ matrix.scheme }}
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          # heif and friends need CMake >= 3.21 and < 4; the runner ships CMake 4
          python -m pip install aqtinstall "cmake==3.31.6"
          cmake --version
          python -m aqt install-qt mac desktop 5.15.2 clang_64 -O "$HOME/Qt"
          "$HOME/Qt/5.15.2/clang_64/bin/qmake" --version
          npm install -g grunt-cli
          brew install p7zip || true
          xcodebuild -version
          df -h /

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: worksuite-office

      - name: Version and updates
        id: updates
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
          INPUT_CHANNEL: ${{ inputs.channel || 'beta' }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          HAS_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
          HAS_CERT: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.MACOS_CERTIFICATE_PASSWORD != '' }}
          HAS_NOTARY: ${{ secrets.MACOS_NOTARY_KEY != '' && secrets.MACOS_NOTARY_KEY_ID != '' && secrets.MACOS_NOTARY_ISSUER != '' }}
        run: |
          build="${INPUT_BUILD:-$((1000 + GITHUB_RUN_NUMBER))}"
          # Installed copies report CFBundleVersion 537: a lower number would never be offered to them.
          if ! [[ "$build" =~ ^[0-9]+$ ]] || (( build <= 537 )); then echo "::error::build_number must be a whole number above 537"; exit 1; fi
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "UPDATE_CHANNEL=$INPUT_CHANNEL" >> "$GITHUB_ENV"
          if [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::warning::No SPARKLE_PUBLIC_ED_KEY repository variable: this build cannot verify updates, so it will not install any."
          fi
          if [ "$HAS_PRIVATE_KEY" = true ] && [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is set but SPARKLE_PUBLIC_ED_KEY is not: the app would not trust its own updates"; exit 1
          fi
          echo "sign=$HAS_PRIVATE_KEY" >> "$GITHUB_OUTPUT"
          # Developer ID and notarisation: both or neither (a signed, unnotarised DMG is refused by Gatekeeper too)
          if [ "$HAS_CERT" = true ] && [ "$HAS_NOTARY" = true ]; then
            echo "codesign=true" >> "$GITHUB_OUTPUT"
          else
            echo "codesign=false" >> "$GITHUB_OUTPUT"
            [ "$HAS_CERT" = "$HAS_NOTARY" ] || echo "::warning::Only some of the macOS signing secrets are set: MACOS_CERTIFICATE_P12 and MACOS_CERTIFICATE_PASSWORD go with MACOS_NOTARY_KEY, MACOS_NOTARY_KEY_ID and MACOS_NOTARY_ISSUER"
            echo "::warning::Not Developer ID signed or notarised (no MACOS_CERTIFICATE_P12 / MACOS_NOTARY_* secrets): Gatekeeper warns on first launch, and the build is for the beta channel only."
            [ "$INPUT_CHANNEL" != stable ] || { echo "::error::The stable channel takes only Developer ID signed, notarised builds"; exit 1; }
          fi

      - name: Fetch sources
        run: |
          mkdir oo && cd oo
          git clone --depth 1 -b "$BUILD_TOOLS_REF" https://github.com/ONLYOFFICE/build_tools.git
          # Pinned, not just named: `-b` follows a branch head, and build/v10/prepare.sh patches
          # build_tools by matching exact source text. When the head moves the patches stop
          # applying and the build dies in `prepare`, which is what `master` did here.
          git -C build_tools fetch --depth 1 origin "$BUILD_TOOLS_SHA"
          git -C build_tools checkout --detach "$BUILD_TOOLS_SHA"
          git -C build_tools log --oneline -1
          for r in core sdkjs sdkjs-forms web-apps dictionaries core-fonts desktop-sdk document-templates; do
            git clone --depth 1 -b "$OO_TAG" --recurse-submodules --shallow-submodules "https://github.com/ONLYOFFICE/$r.git"
          done
          git clone --depth 1 https://github.com/ONLYOFFICE/onlyoffice.github.io.git
          git clone --depth 1 https://github.com/Livezen-Technologies/worksuite-office-desktop-apps.git desktop-apps
          git -C desktop-apps fetch --depth 1 origin "$DESKTOP_APPS_REF"
          git -C desktop-apps checkout --detach "$DESKTOP_APPS_REF"
          git -C desktop-apps log --oneline -1

      - name: WorkSuite's changes to the editors
        run: |
          python worksuite-office/build/patch-editor-menu.py oo/web-apps
          python worksuite-office/build/patch-pdf-convert.py oo/web-apps
          python worksuite-office/build/patch-ai-panel.py oo/desktop-sdk oo/desktop-apps

      - name: Sinhala Tools (plugin and Noto Sinhala fonts)
        working-directory: oo
        run: bash ../worksuite-office/build/v10/sinhala.sh "$GITHUB_WORKSPACE/worksuite-office"

      - name: WorkSuite Local AI (editor plugin)
        working-directory: oo
        run: bash ../worksuite-office/build/v10/ai.sh "$GITHUB_WORKSPACE/worksuite-office"

      - name: Text recognition for the PDF Editor (tesseract.js, English/Sinhala/Tamil models)
        working-directory: oo
        run: bash ../worksuite-office/build/v10/ocr.sh "$GITHUB_WORKSPACE/worksuite-office"

      - name: Build the start page (Vite)
        working-directory: oo/desktop-apps/common/loginpage
        run: |
          # an optional peer of a dev tool (jsdom's canvas) stops npm's resolver without this
          npm config set legacy-peer-deps true
          for d in addondialog noconnect .; do
            (cd "$d" && npm install --no-audit --no-fund && npm run build)
          done
          ls -la deploy addondialog/deploy 2>/dev/null || ls -la deploy

      - name: Build core, editors and SDK (build_tools)
        working-directory: oo/build_tools
        run: |
          # v10 core fetches libxml2 itself (Common/3dParty/libxml/fetch.py); build_tools 9.4 does not call it
          (cd ../core/Common/3dParty/libxml && python fetch.py && test -f libxml2/HTMLparser.c)
          # build_tools 9.4 builds x265 into heif/x265_git; v10's heif.pri links it from heif/x265
          ln -sfn x265_git ../core/Common/3dParty/heif/x265
          # v10's desktop core uses socket.io's asio (WebSocket/localipc); build_tools 9.4 fetches it for mobile only
          python - <<'PY'
          p = "scripts/core_common/make_common.py"
          s = open(p).read()
          old = "    websocket_all.make()\n  return"
          assert old in s, "make_common.py changed"
          s = s.replace(old, "    websocket_all.make()\n  if not config.check_option(\"module\", \"mobile\"):\n    websocket_all.make()\n  return")
          open(p, "w").write(s)
          # the v10 start page is built with Vite in the step before; build_tools 9.4 would run Grunt on it and stop
          p = "scripts/build_js.py"
          s = open(p).read()
          old = '    build_interface(base_dir + "/../desktop-apps/common/loginpage/build")\n'
          assert old in s, "build_js.py changed"
          open(p, "w").write(s.replace(old, ""))
          PY
          python configure.py --module desktop --platform "$OO_PLATFORM" --update 0 --clean 0 --qt-dir "$HOME/Qt/5.15.2"
          cat config
          python make.py
          out="out/$OO_PLATFORM/onlyoffice/desktopeditors"
          # build_tools 9.4 does not know the v10 start page's add-on dialog: put it beside index.html
          for f in ../desktop-apps/common/loginpage/deploy/*.html ../desktop-apps/common/loginpage/addondialog/deploy/*.html; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in index.html) cp -fv "$f" "$out/index.html" ;; noconnect.html) ;; *) cp -fv "$f" "$out/" ;; esac
          done
          ls -la "$out"
          test -f "$out/editors/sdkjs-plugins/{B50BAEE2-4EAC-4298-9DD2-73CC3223FFFA}/config.json" || { echo "::error::Sinhala Tools is not in the editors"; exit 1; }
          test -f "$out/editors/sdkjs-plugins/{7A1E5C0D-3B2F-4D6A-9E81-5C4F2B7D0A11}/config.json" || { echo "::error::WorkSuite Local AI is not in the editors"; exit 1; }
          ls "$out/fonts/worksuite-sinhala"

      - name: Developer ID certificate
        id: identity
        if: steps.updates.outputs.codesign == 'true'
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          kc="$RUNNER_TEMP/signing.keychain-db"
          kcpass="$(openssl rand -base64 24)"
          printf '%s' "$MACOS_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$kcpass" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kcpass" "$kc"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$kcpass" "$kc" >/dev/null
          mapfile -t keychains < <(security list-keychains -d user | tr -d '" ')
          security list-keychains -d user -s "$kc" "${keychains[@]}"
          identity=$(security find-identity -v -p codesigning "$kc" | sed -n 's/.*"\(Developer ID Application: .*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "::error::MACOS_CERTIFICATE_P12 holds no Developer ID Application identity"; exit 1; }
          team=$(printf '%s' "$identity" | sed -n 's/.*(\([A-Z0-9]*\))$/\1/p')
          { echo "identity=$identity"; echo "team=$team"; echo "keychain=$kc"; } >> "$GITHUB_OUTPUT"
          echo "Signing as $identity"

      - name: Build the app (Xcode)
        working-directory: oo/desktop-apps/macos
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
          SIGN_TEAM: ${{ steps.identity.outputs.team }}
        run: |
          mkdir -p Vendor/ONLYOFFICE/license
          cp -fv ../package/common/license/opensource/LICENSE.html Vendor/ONLYOFFICE/license/LICENSE.html
          res="ONLYOFFICE/Resources/$SCHEME"
          plist="$res/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $PRODUCT_VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :ASCBundleBuildNumber $BUILD_NUMBER" "$plist"
          # Sparkle compares the feed's sparkle:version (the release's build number) with CFBundleVersion.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :SUFeedURL" "$plist" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :SUFeedURL string $UPDATE_CENTER/api/v1/apps/$UPDATE_APP_ID/channels/$UPDATE_CHANNEL/appcast.xml?arch=$ARCH" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$plist" 2>/dev/null || true
          if [ -n "$SPARKLE_PUBLIC_ED_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $SPARKLE_PUBLIC_ED_KEY" "$plist"
          fi
          sign=(CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="")
          if [ -n "$SIGN_IDENTITY" ]; then
            # notarisation refuses get-task-allow (a debugging entitlement); CEF keeps its JIT entitlements
            /usr/libexec/PlistBuddy -c "Delete :com.apple.security.get-task-allow" "$res/ONLYOFFICE.entitlements" 2>/dev/null || true
            sign=(CODE_SIGN_IDENTITY="$SIGN_IDENTITY" DEVELOPMENT_TEAM="$SIGN_TEAM" CODE_SIGN_STYLE=Manual
                  ENABLE_HARDENED_RUNTIME=YES OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime")
          fi
          mkdir -p build
          set -o pipefail
          xcodebuild -project ONLYOFFICE.xcodeproj -scheme "$SCHEME" -configuration Release \
            -derivedDataPath "$PWD/build/dd" \
            "${sign[@]}" \
            URL_WEBAPPS_HELP="https://download.onlyoffice.com/install/desktop/editors/help/v$PRODUCT_VERSION/apps" \
            build | tee build/xcodebuild.log | grep -E "^(=== |\*\* |error|.*: error|.*warning: unable|Code Signing|CodeSign )" || true
          # a failed build can still leave a partial ONLYOFFICE.app (no Info.plist), so check xcodebuild's own verdict
          grep -q '^\*\* BUILD SUCCEEDED \*\*' build/xcodebuild.log &&
            test -f build/dd/Build/Products/Release/ONLYOFFICE.app/Contents/Info.plist ||
            { grep -E ': error:' build/xcodebuild.log | head -50; tail -100 build/xcodebuild.log; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Local AI service (worksuite-ai) in the app
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          app="$GITHUB_WORKSPACE/oo/desktop-apps/macos/build/dd/Build/Products/Release/ONLYOFFICE.app"
          bash worksuite-office/build/v10/ai-service.sh "$GITHUB_WORKSPACE/worksuite-office" "$app/Contents/MacOS"
          ent="$GITHUB_WORKSPACE/worksuite-office/ai-service/packaging/macos/worksuite-ai.entitlements"
          if [ -n "$SIGN_IDENTITY" ]; then
            codesign --force --timestamp --options runtime --entitlements "$ent" --sign "$SIGN_IDENTITY" "$app/Contents/MacOS/worksuite-ai"
            # the bundle's seal now covers worksuite-ai: sign the app again, keeping its own entitlements
            codesign --force --timestamp --options runtime --preserve-metadata=entitlements,requirements,flags,runtime --sign "$SIGN_IDENTITY" "$app"
            codesign --verify --deep --strict --verbose=2 "$app"
          else
            codesign --force --sign - --entitlements "$ent" "$app/Contents/MacOS/worksuite-ai"
            codesign --force --sign - --preserve-metadata=entitlements,requirements,flags "$app"
          fi
          lipo -archs "$app/Contents/MacOS/worksuite-ai"
          "$app/Contents/MacOS/worksuite-ai" --version

      - name: Package the DMG
        working-directory: oo/desktop-apps/macos
        env:
          SIGN_IDENTITY: ${{ steps.identity.outputs.identity }}
        run: |
          mkdir -p build/stage
          ditto build/dd/Build/Products/Release/ONLYOFFICE.app "build/stage/WorkSuite Office.app"
          if [ -n "$SIGN_IDENTITY" ]; then
            codesign --verify --deep --strict --verbose=2 "build/stage/WorkSuite Office.app"
            codesign -dvv "build/stage/WorkSuite Office.app" 2>&1 | grep -E '^(Authority|TeamIdentifier|Timestamp|flags)'
          else
            codesign --verify --deep --strict --verbose=2 "build/stage/WorkSuite Office.app" || true
          fi
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :SUFeedURL" "build/stage/WorkSuite Office.app/Contents/Info.plist"
          built=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "build/stage/WorkSuite Office.app/Contents/Info.plist")
          [ "$built" = "$BUILD_NUMBER" ] || { echo "::error::the app's CFBundleVersion is $built, not $BUILD_NUMBER"; exit 1; }
          archs=$(lipo -archs "build/stage/WorkSuite Office.app/Contents/MacOS/WSOffice")
          echo "$archs"
          want=$([ "$ARCH" = x64 ] && echo x86_64 || echo arm64)
          [[ " $archs " == *" $want "* ]] || { echo "::error::the app is $archs, not $want"; exit 1; }
          test -x "build/stage/WorkSuite Office.app/Contents/MacOS/worksuite-ai" || { echo "::error::worksuite-ai is not in the app"; exit 1; }
          ln -s /Applications build/stage/Applications
          hdiutil create -volname "WorkSuite Office" -srcfolder build/stage -ov -format UDZO \
            "build/WorkSuite-Office-$PRODUCT_VERSION-$ARCH.dmg"
          [ -z "$SIGN_IDENTITY" ] || codesign --force --timestamp --sign "$SIGN_IDENTITY" "build/WorkSuite-Office-$PRODUCT_VERSION-$ARCH.dmg"
          ls -la build/*.dmg

      # before the Sparkle signature: stapling changes the DMG's bytes
      - name: Notarise and staple the DMG
        if: steps.updates.outputs.codesign == 'true'
        working-directory: oo/desktop-apps/macos
        env:
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
        run: |
          key="$RUNNER_TEMP/notary.p8"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$MACOS_NOTARY_KEY" | base64 --decode > "$key"
          dmg="build/WorkSuite-Office-$PRODUCT_VERSION-$ARCH.dmg"
          out=$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" \
            --wait --timeout 2h --output-format json)
          echo "$out"
          id=$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("id",""))')
          status=$(printf '%s' "$out" | python3 -c 'import json,sys; print(json.load(sys.stdin).get("status",""))')
          if [ "$status" != Accepted ]; then
            [ -z "$id" ] || xcrun notarytool log "$id" --key "$key" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_ISSUER" || true
            echo "::error::notarisation: $status"; exit 1
          fi
          xcrun stapler staple "$dmg"
          xcrun stapler validate "$dmg"
          spctl --assess --type open --context context:primary-signature --verbose=2 "$dmg"
          touch "$dmg.notarized"

      - name: Sign the DMG for Sparkle
        if: steps.updates.outputs.sign == 'true'
        working-directory: oo/desktop-apps/macos
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          key="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          dmg="build/WorkSuite-Office-$PRODUCT_VERSION-$ARCH.dmg"
          # Sparkle's own tool, for the key format generate_keys -x exports.
          sig=$(Vendor/Sparkle/bin/sign_update -f "$key" "$dmg" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          [ -n "$sig" ] || { echo "::error::sign_update gave no signature"; exit 1; }
          printf '%s\n' "$sig" > "$dmg.edsig"
          # As Sparkle will check it: Ed25519 over the whole DMG, against the key the app carries.
          node -e '
            const [file, sigFile, pub] = process.argv.slice(1);
            const { createPublicKey, verify } = require("crypto"), fs = require("fs");
            const key = createPublicKey({ key: { kty: "OKP", crv: "Ed25519", x: Buffer.from(pub, "base64").toString("base64url") }, format: "jwk" });
            if (!verify(null, fs.readFileSync(file), key, Buffer.from(fs.readFileSync(sigFile, "utf8").trim(), "base64"))) {
              console.error("::error::the Sparkle signature does not match SPARKLE_PUBLIC_ED_KEY"); process.exit(1);
            }' "$dmg" "$dmg.edsig" "$SPARKLE_PUBLIC_ED_KEY"
          echo "Sparkle signature checked against SPARKLE_PUBLIC_ED_KEY"

      - name: Summary
        working-directory: oo/desktop-apps/macos
        run: |
          {
            echo "### WorkSuite Office $PRODUCT_VERSION ($BUILD_NUMBER), macOS $ARCH"
            echo "- Updates from: \`$UPDATE_CENTER/api/v1/apps/$UPDATE_APP_ID/channels/$UPDATE_CHANNEL/appcast.xml?arch=$ARCH\`"
            if ls build/*.notarized >/dev/null 2>&1; then
              echo "- Developer ID signed, notarised and stapled."
            else
              echo "- Not Developer ID signed or notarised (beta channel only)."
            fi
            if ls build/*.edsig >/dev/null 2>&1; then
              echo "- Signed for Sparkle (\`.edsig\` beside the DMG)."
            else
              echo "- Not signed for Sparkle (no SPARKLE_ED_PRIVATE_KEY secret): installed copies will not take it as an update."
            fi
            echo "- Publish it with **Publish to the WorkSuite Update Center**: mac_run \`$GITHUB_RUN_ID\`, version \`$PRODUCT_VERSION\`, build \`$BUILD_NUMBER\`, channel \`$(printf '%s' "$UPDATE_CHANNEL" | tr '[:lower:]' '[:upper:]')\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}-dmg
          path: |
            oo/desktop-apps/macos/build/*.dmg
            oo/desktop-apps/macos/build/*.dmg.edsig
          compression-level: 0

      - name: Remove the signing keychain
        if: always() && steps.identity.outputs.keychain != ''
        env:
          KEYCHAIN: ${{ steps.identity.outputs.keychain }}
        run: security delete-keychain "$KEYCHAIN" || true

      - name: Keep the Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log-${{ matrix.arch }}
          path: oo/desktop-apps/macos/build/xcodebuild.log
          if-no-files-found: ignore

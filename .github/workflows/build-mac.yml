name: Build WorkSuite Office (macOS arm64)

# Euro-Office has no macOS build. The macOS app is the ONLYOFFICE Xcode project
# (desktop-apps/macos, rebranded in our fork) linked against the ONLYOFFICE core,
# editors and SDK of the same version, built with ONLYOFFICE build_tools.
#
# 10.0: the editors are ONLYOFFICE's v10 tags. ONLYOFFICE's public build_tools stops at 9.4
# (BUILD_TOOLS_REF), and its start page build still runs Grunt, which the v10 start page (Vite)
# no longer has: the start page is built here first, so build_tools finds deploy/index.html.

# Updates: the app's Sparkle reads its feed from the Update Center (download.worksuitecloud.com,
# worksite-download docs/sparkle.md). This build stamps the feed's channel, a rising CFBundleVersion and
# WorkSuite's Sparkle public key (repository variable SPARKLE_PUBLIC_ED_KEY) into the app, and signs the
# DMG with the private key (secret SPARKLE_ED_PRIVATE_KEY) into <dmg>.edsig, which
# scripts/publish-release.mjs in worksite-download puts into the release's attestation.

on:
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel the app follows. Beta until builds are Developer ID signed and notarised, which Stable requires.
        type: choice
        options: [beta, stable]
        default: beta
      build_number:
        description: Build number, the app's CFBundleVersion. It must rise with every release on a channel; empty means 1000 + this workflow's run number.
        required: false
        default: ''

env:
  OO_TAG: v10.0.0.176
  BUILD_TOOLS_REF: master
  # desktop-apps' v10 branch: the Windows and Linux builds keep the 9.3 desktop-apps this repository pins
  DESKTOP_APPS_REF: 8f50351d14f75c902e7bf979ee04b569a9c04437
  PRODUCT_VERSION: 10.0.0
  COMPANY_NAME: WorkSuite
  UPDATE_CENTER: https://download.worksuitecloud.com
  UPDATE_APP_ID: lk.worksuite.office

jobs:
  build-mac-arm64:
    runs-on: macos-14
    timeout-minutes: 360
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install build tools
        run: |
          softwareupdate --install-rosetta --agree-to-license || true
          # heif and friends need CMake >= 3.21 and < 4; the runner ships CMake 4
          python -m pip install aqtinstall "cmake==3.31.6"
          cmake --version
          python -m aqt install-qt mac desktop 5.15.2 clang_64 -O "$HOME/Qt"
          "$HOME/Qt/5.15.2/clang_64/bin/qmake" --version
          npm install -g grunt-cli
          brew install p7zip || true
          xcodebuild -version
          df -h /

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: worksuite-office

      - name: Version and updates
        id: updates
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
          INPUT_CHANNEL: ${{ inputs.channel || 'beta' }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          HAS_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        run: |
          build="${INPUT_BUILD:-$((1000 + GITHUB_RUN_NUMBER))}"
          # Installed copies report CFBundleVersion 537: a lower number would never be offered to them.
          if ! [[ "$build" =~ ^[0-9]+$ ]] || (( build <= 537 )); then echo "::error::build_number must be a whole number above 537"; exit 1; fi
          echo "BUILD_NUMBER=$build" >> "$GITHUB_ENV"
          echo "UPDATE_CHANNEL=$INPUT_CHANNEL" >> "$GITHUB_ENV"
          if [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::warning::No SPARKLE_PUBLIC_ED_KEY repository variable: this build cannot verify updates, so it will not install any."
          fi
          if [ "$HAS_PRIVATE_KEY" = true ] && [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is set but SPARKLE_PUBLIC_ED_KEY is not: the app would not trust its own updates"; exit 1
          fi
          echo "sign=$HAS_PRIVATE_KEY" >> "$GITHUB_OUTPUT"

      - name: Fetch sources
        run: |
          mkdir oo && cd oo
          git clone --depth 1 -b "$BUILD_TOOLS_REF" https://github.com/ONLYOFFICE/build_tools.git
          git -C build_tools log --oneline -1
          for r in core sdkjs sdkjs-forms web-apps dictionaries core-fonts desktop-sdk document-templates; do
            git clone --depth 1 -b "$OO_TAG" --recurse-submodules --shallow-submodules "https://github.com/ONLYOFFICE/$r.git"
          done
          git clone --depth 1 https://github.com/ONLYOFFICE/onlyoffice.github.io.git
          git clone --depth 1 https://github.com/Livezen-Technologies/worksuite-office-desktop-apps.git desktop-apps
          git -C desktop-apps fetch --depth 1 origin "$DESKTOP_APPS_REF"
          git -C desktop-apps checkout --detach "$DESKTOP_APPS_REF"
          git -C desktop-apps log --oneline -1

      - name: WorkSuite's changes to the editors
        run: |
          python worksuite-office/build/patch-editor-menu.py oo/web-apps
          python worksuite-office/build/patch-pdf-convert.py oo/web-apps

      - name: Build the start page (Vite)
        working-directory: oo/desktop-apps/common/loginpage
        run: |
          # an optional peer of a dev tool (jsdom's canvas) stops npm's resolver without this
          npm config set legacy-peer-deps true
          for d in addondialog noconnect .; do
            (cd "$d" && npm install --no-audit --no-fund && npm run build)
          done
          ls -la deploy addondialog/deploy 2>/dev/null || ls -la deploy

      - name: Build core, editors and SDK (build_tools)
        working-directory: oo/build_tools
        run: |
          # v10 core fetches libxml2 itself (Common/3dParty/libxml/fetch.py); build_tools 9.4 does not call it
          (cd ../core/Common/3dParty/libxml && python fetch.py && test -f libxml2/HTMLparser.c)
          # build_tools 9.4 builds x265 into heif/x265_git; v10's heif.pri links it from heif/x265
          ln -sfn x265_git ../core/Common/3dParty/heif/x265
          # v10's desktop core uses socket.io's asio (WebSocket/localipc); build_tools 9.4 fetches it for mobile only
          python - <<'PY'
          p = "scripts/core_common/make_common.py"
          s = open(p).read()
          old = "    websocket_all.make()\n  return"
          assert old in s, "make_common.py changed"
          s = s.replace(old, "    websocket_all.make()\n  if not config.check_option(\"module\", \"mobile\"):\n    websocket_all.make()\n  return")
          open(p, "w").write(s)
          # the v10 start page is built with Vite in the step before; build_tools 9.4 would run Grunt on it and stop
          p = "scripts/build_js.py"
          s = open(p).read()
          old = '    build_interface(base_dir + "/../desktop-apps/common/loginpage/build")\n'
          assert old in s, "build_js.py changed"
          open(p, "w").write(s.replace(old, ""))
          PY
          python configure.py --module desktop --platform mac_arm64 --update 0 --clean 0 --qt-dir "$HOME/Qt/5.15.2"
          cat config
          python make.py
          out=out/mac_arm64/onlyoffice/desktopeditors
          # build_tools 9.4 does not know the v10 start page's add-on dialog: put it beside index.html
          for f in ../desktop-apps/common/loginpage/deploy/*.html ../desktop-apps/common/loginpage/addondialog/deploy/*.html; do
            [ -f "$f" ] || continue
            case "$(basename "$f")" in index.html) cp -fv "$f" "$out/index.html" ;; noconnect.html) ;; *) cp -fv "$f" "$out/" ;; esac
          done
          ls -la "$out"

      - name: Build the app (Xcode)
        working-directory: oo/desktop-apps/macos
        env:
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          mkdir -p Vendor/ONLYOFFICE/license
          cp -fv ../package/common/license/opensource/LICENSE.html Vendor/ONLYOFFICE/license/LICENSE.html
          plist=ONLYOFFICE/Resources/ONLYOFFICE-arm/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $PRODUCT_VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :ASCBundleBuildNumber $BUILD_NUMBER" "$plist"
          # Sparkle compares the feed's sparkle:version (the release's build number) with CFBundleVersion.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" "$plist"
          /usr/libexec/PlistBuddy -c "Set :SUFeedURL $UPDATE_CENTER/api/v1/apps/$UPDATE_APP_ID/channels/$UPDATE_CHANNEL/appcast.xml?arch=arm64" "$plist"
          /usr/libexec/PlistBuddy -c "Delete :SUPublicEDKey" "$plist" 2>/dev/null || true
          if [ -n "$SPARKLE_PUBLIC_ED_KEY" ]; then
            /usr/libexec/PlistBuddy -c "Add :SUPublicEDKey string $SPARKLE_PUBLIC_ED_KEY" "$plist"
          fi
          set -o pipefail
          xcodebuild -project ONLYOFFICE.xcodeproj -scheme ONLYOFFICE-arm -configuration Release \
            -derivedDataPath "$PWD/build/dd" \
            CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" \
            URL_WEBAPPS_HELP="https://download.onlyoffice.com/install/desktop/editors/help/v$PRODUCT_VERSION/apps" \
            build | tee build/xcodebuild.log | grep -E "^(=== |\*\* |error|.*: error|.*warning: unable|Code Signing|CodeSign )" || true
          test -d build/dd/Build/Products/Release/ONLYOFFICE.app || { tail -200 build/xcodebuild.log; exit 1; }

      - name: Package the DMG
        working-directory: oo/desktop-apps/macos
        run: |
          mkdir -p build/stage
          ditto build/dd/Build/Products/Release/ONLYOFFICE.app "build/stage/WorkSuite Office.app"
          codesign --verify --deep --strict --verbose=2 "build/stage/WorkSuite Office.app" || true
          /usr/libexec/PlistBuddy -c "Print :CFBundleName" -c "Print :CFBundleIdentifier" -c "Print :CFBundleShortVersionString" -c "Print :SUFeedURL" "build/stage/WorkSuite Office.app/Contents/Info.plist"
          built=$(/usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "build/stage/WorkSuite Office.app/Contents/Info.plist")
          [ "$built" = "$BUILD_NUMBER" ] || { echo "::error::the app's CFBundleVersion is $built, not $BUILD_NUMBER"; exit 1; }
          lipo -archs "build/stage/WorkSuite Office.app/Contents/MacOS/ONLYOFFICE"
          ln -s /Applications build/stage/Applications
          hdiutil create -volname "WorkSuite Office" -srcfolder build/stage -ov -format UDZO \
            "build/WorkSuite-Office-$PRODUCT_VERSION-arm64.dmg"
          ls -la build/*.dmg

      - name: Sign the DMG for Sparkle
        if: steps.updates.outputs.sign == 'true'
        working-directory: oo/desktop-apps/macos
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: |
          key="$RUNNER_TEMP/sparkle.key"
          trap 'rm -f "$key"' EXIT
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          dmg="build/WorkSuite-Office-$PRODUCT_VERSION-arm64.dmg"
          # Sparkle's own tool, for the key format generate_keys -x exports.
          sig=$(Vendor/Sparkle/bin/sign_update -f "$key" "$dmg" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')
          [ -n "$sig" ] || { echo "::error::sign_update gave no signature"; exit 1; }
          printf '%s\n' "$sig" > "$dmg.edsig"
          # As Sparkle will check it: Ed25519 over the whole DMG, against the key the app carries.
          node -e '
            const [file, sigFile, pub] = process.argv.slice(1);
            const { createPublicKey, verify } = require("crypto"), fs = require("fs");
            const key = createPublicKey({ key: { kty: "OKP", crv: "Ed25519", x: Buffer.from(pub, "base64").toString("base64url") }, format: "jwk" });
            if (!verify(null, fs.readFileSync(file), key, Buffer.from(fs.readFileSync(sigFile, "utf8").trim(), "base64"))) {
              console.error("::error::the Sparkle signature does not match SPARKLE_PUBLIC_ED_KEY"); process.exit(1);
            }' "$dmg" "$dmg.edsig" "$SPARKLE_PUBLIC_ED_KEY"
          echo "Sparkle signature checked against SPARKLE_PUBLIC_ED_KEY"

      - name: Summary
        working-directory: oo/desktop-apps/macos
        run: |
          {
            echo "### WorkSuite Office $PRODUCT_VERSION ($BUILD_NUMBER), macOS arm64"
            echo "- Updates from: \`$UPDATE_CENTER/api/v1/apps/$UPDATE_APP_ID/channels/$UPDATE_CHANNEL/appcast.xml?arch=arm64\`"
            if ls build/*.edsig >/dev/null 2>&1; then
              echo "- Signed for Sparkle (\`.edsig\` beside the DMG)."
            else
              echo "- Not signed for Sparkle (no SPARKLE_ED_PRIVATE_KEY secret): installed copies will not take it as an update."
            fi
            echo "- Publish it with **Publish to the WorkSuite Update Center**: mac_run \`$GITHUB_RUN_ID\`, version \`$PRODUCT_VERSION\`, build \`$BUILD_NUMBER\`, channel \`$(printf '%s' "$UPDATE_CHANNEL" | tr '[:lower:]' '[:upper:]')\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: |
            oo/desktop-apps/macos/build/*.dmg
            oo/desktop-apps/macos/build/*.dmg.edsig
          compression-level: 0

      - name: Keep the Xcode log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-log
          path: oo/desktop-apps/macos/build/xcodebuild.log
          if-no-files-found: ignore

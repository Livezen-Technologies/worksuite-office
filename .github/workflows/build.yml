name: Build WorkSuite Office (Windows/Linux)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

env:
  PRODUCT_VERSION: 9.3.1
  BUILD_NUMBER: dev.1
  BUILD_ROOT: /package
  COMPANY_NAME: WorkSuite
  PRODUCT_NAME: Office

jobs:

  # The editors web payload (JS + WASM). Platform-independent, built once and
  # consumed by both desktop builds.
  build-common:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: actions/cache@v4
        id: wasm-cache
        with:
          path: |
            wasm-ccache
            wasm-em-cache
          key: ${{ runner.os }}-wasm-${{ hashFiles('core/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-wasm-

      - uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "wasm-ccache":   { "target": "/ccache",   "id": "wasm-ccache" },
              "wasm-em-cache": { "target": "/em-cache", "id": "wasm-em-cache" }
            }
          skip-extraction: ${{ steps.wasm-cache.outputs.cache-hit }}

      - name: Build the common payload
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          files: |
            ./docker-bake.hcl
          targets: desktop-common
          push: false
          set: |
            *.cache-from=type=gha,scope=common
            *.cache-to=type=gha,scope=common,mode=max
            core-wasm.tags=
            sdkjs-desktop.tags=
            desktop-js.tags=
            web-apps.tags=
            desktop-common.tags=
            desktop-common.output=type=tar,dest=./common.tar
        env:
          NUGET_CACHE: local

      - uses: actions/upload-artifact@v4
        with:
          name: common-files
          path: ./build/common.tar
          compression-level: 0

  build-windows:
    runs-on: windows-2022
    needs: build-common
    timeout-minutes: 360
    env:
      PYTHONUTF8: "1"
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - uses: actions/download-artifact@v4
        with:
          name: common-files
          path: .

      - name: Extract common
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path .\common | Out-Null
          tar -xf .\common.tar -C .\common
          Remove-Item .\common.tar

      # Cygwin is kept off PATH; build.ps1 orders PATH itself.
      - name: Install Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: >-
            automake
            cmake
            make
            git
            python3
            python3-devel

      - name: Install aqtinstall
        shell: pwsh
        run: python -m pip install --upgrade --break-system-packages aqtinstall

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.10

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja -y --no-progress

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11

      # ProductName stays DesktopEditors: it is the internal install/registry
      # path, not what the user sees. The shown name is "WorkSuite Office".
      - name: Build & package
        shell: pwsh
        run: |
          .\build\windows\build.ps1 `
            -CommonDir      "${{ github.workspace }}\common" `
            -ProductVersion "${{ env.PRODUCT_VERSION }}" `
            -Arch           x64 `
            -Target         standalone `
            -CompanyName    WorkSuite `
            -ProductName    DesktopEditors

      - name: Name the installers WorkSuite-Office
        shell: pwsh
        run: |
          Get-ChildItem desktop-apps\package\zip\*.zip, desktop-apps\package\inno\*.exe -ErrorAction SilentlyContinue |
            Where-Object { $_.Name -like 'WorkSuite-DesktopEditors*' } |
            Rename-Item -NewName { $_.Name -replace '^WorkSuite-DesktopEditors', 'WorkSuite-Office' }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages-x64
          path: |
            desktop-apps/package/zip/*.zip
            desktop-apps/package/inno/WorkSuite-Office*.exe

  build-linux:
    runs-on: ubuntu-latest
    needs: build-common
    timeout-minutes: 360
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/download-artifact@v4
        with:
          name: common-files
          path: ./build/linux

      - name: Extract common
        run: |
          mkdir -p ./build/linux/common
          tar -xf ./build/linux/common.tar -C ./build/linux/common
          rm ./build/linux/common.tar

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Restore desktop build caches
        uses: actions/cache@v4
        id: desktop-cache
        with:
          path: |
            ccache
            nuget-cache
          key: ${{ runner.os }}-desktop-${{ hashFiles('core/vcpkg.json', 'desktop-apps/win-linux/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-desktop-

      - name: Inject caches into BuildKit
        uses: reproducible-containers/buildkit-cache-dance@v3.4.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          cache-map: |
            {
              "ccache": { "target": "/ccache", "id": "ccache" },
              "nuget-cache": { "target": "/nuget-cache", "id": "nuget-cache" }
            }
          skip-extraction: ${{ steps.desktop-cache.outputs.cache-hit }}

      - name: Build the app and packages
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build/linux
          files: |
            ./docker-bake.hcl
          targets: packages
          push: false
          set: |
            *.cache-from=type=gha,scope=linux
            *.cache-to=type=gha,scope=linux,mode=max
            core-base.tags=
            desktop-linux.tags=
            desktop-linux.contexts.desktop-common=./common
            packages.tags=
        env:
          GIT_COMMIT: ${{ github.sha }}
          NUGET_CACHE: local
          # No remote dependency cache: third-party libraries build from source.
          NEXTCLOUD_USER: ""
          NEXTCLOUD_PASS: ""

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages-amd64
          path: |
            build/linux/deploy/packages/*.deb
            build/linux/deploy/packages/*.rpm
            build/linux/deploy/packages/*.tar.xz

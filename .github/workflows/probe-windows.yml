name: Probe Windows third-party step

# Diagnostic only: runs the real Windows build script up to the OpenSSL step
# and prints what nmake sees there.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      PYTHONUTF8: "1"
      SCCACHE_GHA_ENABLED: "true"
      WS_PROBE_OPENSSL: "1"
      PRODUCT_VERSION: 9.3.1
      BUILD_NUMBER: dev.1
      BUILD_ROOT: /package
      COMPANY_NAME: WorkSuite
      PRODUCT_NAME: Office
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: recursive
      - shell: pwsh
        run: |
          python build\patch-upstream.py
          New-Item -ItemType Directory -Force -Path .\common\editors\webext | Out-Null
          Set-Content .\common\index.html 'x'; Set-Content .\common\editors\webext\noconnect.html 'x'
      - uses: cygwin/cygwin-install-action@v4
        with:
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: automake cmake make git python3 python3-devel
      - shell: pwsh
        run: python -m pip install --upgrade --break-system-packages aqtinstall
      - uses: mozilla-actions/sccache-action@v0.0.10
      - shell: pwsh
        run: choco install ninja -y --no-progress
      - uses: lukka/run-vcpkg@v11
      - name: Run the build script up to OpenSSL
        shell: pwsh
        run: |
          .\build\windows\build.ps1 -CommonDir "${{ github.workspace }}\common" -ProductVersion 9.3.1 -Arch x64 -Target standalone -CompanyName WorkSuite -ProductName DesktopEditors

name: Probe OpenSSL 1.1.1w on Windows

# Diagnostic only: reproduces the OpenSSL step of the Windows desktop build
# with and without Cygwin on PATH.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: windows-2022
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        variant: [cygwin, nocygwin]
    steps:
      - uses: actions/checkout@v4
      - name: Fetch core only
        run: git submodule update --init --depth 1 core

      - name: Install Cygwin
        if: matrix.variant == 'cygwin'
        uses: cygwin/cygwin-install-action@v4
        with:
          install-dir: 'C:\cygwin64'
          add-to-path: false
          packages: automake cmake make git python3 python3-devel

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: amd64
          sdk: 10.0.19041.0

      - name: Build OpenSSL the way the desktop build does
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          $native = @()
          foreach ($tool in 'perl','python','git','cmake') {
            $dir = Split-Path (Get-Command $tool).Source
            if ($tool -eq 'git' -and $dir -like '*\Git\bin') { $dir = Join-Path (Split-Path $dir) 'cmd' }
            if ($native -notcontains $dir) { $native += $dir }
          }
          if ('${{ matrix.variant }}' -eq 'cygwin') { $env:PATH = ($native + 'C:\cygwin64\bin' + $env:PATH) -join ';'; $env:CYGWIN_ROOT = 'C:\cygwin64' }
          foreach ($t in 'perl','python','git','nmake','sh','make','cp','rm') { $c = Get-Command $t -ErrorAction SilentlyContinue; "{0,-6} -> {1}" -f $t, $c.Source }
          python core\Common\3dParty\build_3rdparty.py --only=openssl "$PWD\w" "$PWD\i"
          $rc = $LASTEXITCODE
          "RESULT ${{ matrix.variant }}: exit $rc"
          $src = Get-ChildItem -Path "$PWD\w" -Recurse -Filter makefile -Depth 2 | Select-Object -First 1
          if ($src) {
            $d = $src.DirectoryName; "makefile in $d"
            Test-Path "$d\apps\apps.c"
            Select-String -Path $src.FullName -Pattern 'apps\\apps\.c' | Select-Object -First 4 | ForEach-Object { $_.Line }
            Select-String -Path $src.FullName -Pattern '^(SRCDIR|BLDDIR|PERL|PLATFORM)=' | ForEach-Object { $_.Line }
            Push-Location $d; nmake apps\apps.obj 2>&1 | Select-Object -Last 15; Pop-Location
          }
          exit $rc

name: Build WorkSuite Office 10 (Windows x64)

# The 10.0 Windows build: ONLYOFFICE's v10 sources built with ONLYOFFICE's public build_tools (9.4),
# patched by build/v10/prepare.sh, and packaged with desktop-apps/package (Inno Setup) under
# WorkSuite's names. The 9.3 Windows build (Euro-Office) is build.yml.
#
# Updates (UPD-04, G-02): WinSparkle (pinned, sha256-checked) reads the Update Center's appcast for Windows,
# as Sparkle does on macOS. The build hands the app its feed URL and the EdDSA public key (repository
# variable SPARKLE_PUBLIC_ED_KEY) through the environment of build_tools' qmake (WS_UPDATE_APPCAST_URL,
# WS_UPDATE_EDDSA_PUBLIC_KEY, WINSPARKLE_DIR), ships WinSparkle.dll beside the app, and writes the
# installer's sparkle:edSignature to <installer>.edsig with the secret SPARKLE_ED_PRIVATE_KEY.
# Code signing (UPD-06, NFR-08, G-03): the app's binaries and the installer are Authenticode-signed with a
# PFX certificate (secrets WINDOWS_CERTIFICATE_PFX, WINDOWS_CERTIFICATE_PASSWORD) or with Azure Trusted
# Signing (secrets AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET; variables AZURE_SIGNING_ENDPOINT,
# AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE). With neither, the build is unsigned, with a warning, and
# for the beta channel only. build/README.md, "Signing and updates".

on:
  # a new workflow can only be dispatched once it is on the default branch: until then, pushes to office-v10 run it
  push:
    branches: [office-v10]
    paths: ['.github/workflows/build-windows-v10.yml', 'build/v10/**', 'sinhala/**', 'ai-service/**', 'ai-plugin/**']
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number; empty means 1000 + this workflow's run number.
        required: false
        default: ''
      channel:
        description: Update channel the app follows. Stable takes only Authenticode-signed builds.
        type: choice
        options: [beta, stable]
        default: beta

env:
  OO_TAG: v10.0.0.176
  BUILD_TOOLS_REF: release/v9.4.0
  BUILD_TOOLS_SHA: cf4cac0846d03e2e00a6fec5d1ecd4e9463086d5
  DESKTOP_APPS_REF: c9153817ec35c737afea0b81345026a76bf8a627
  PRODUCT_VERSION: 10.1.7
  # depot_tools (V8) stays at the pinned commit: its self-update collides with build_tools' bootstrap edits
  DEPOT_TOOLS_UPDATE: '0'
  # build/v10/prepare.sh: CMake builds use VS 2022's generator with the 2019 toolset (v142)
  WS_VS2022_AS_2019: '1'
  # a run id whose windows-build-output to package instead of building again (empty: build)
  REUSE_BUILD_RUN: ''
  UPDATE_CENTER: https://download.worksuitecloud.com
  UPDATE_APP_ID: lk.worksuite.office
  WINSPARKLE_VERSION: 0.9.2
  WINSPARKLE_SHA256: 2a5facf5a22056edf7afc4d0a4bf05620b7aa7cc1619c3078b281e374cdb9996

defaults:
  run:
    shell: bash

jobs:
  build-windows-x64:
    runs-on: windows-2022
    timeout-minutes: 360
    steps:
      - name: Short paths
        shell: pwsh
        run: |
          git config --system core.longpaths true
          New-Item -ItemType Directory -Force C:\oo | Out-Null

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: worksuite-office

      - name: Build number
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
        run: echo "BUILD_NUMBER=${INPUT_BUILD:-$((1000 + GITHUB_RUN_NUMBER))}" >> "$GITHUB_ENV"

      - name: Signing and updates
        id: signing
        env:
          INPUT_CHANNEL: ${{ inputs.channel || 'beta' }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
          HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
          HAS_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX != '' && secrets.WINDOWS_CERTIFICATE_PASSWORD != '' }}
          HAS_AZURE: ${{ secrets.AZURE_TENANT_ID != '' && secrets.AZURE_CLIENT_ID != '' && secrets.AZURE_CLIENT_SECRET != '' && vars.AZURE_SIGNING_ENDPOINT != '' && vars.AZURE_SIGNING_ACCOUNT != '' && vars.AZURE_SIGNING_PROFILE != '' }}
        run: |
          # what the app's WinSparkle reads (desktop-apps takes these from qmake's environment)
          {
            echo "UPDATE_CHANNEL=$INPUT_CHANNEL"
            echo "WS_UPDATE_APPCAST_URL=$UPDATE_CENTER/api/v1/apps/$UPDATE_APP_ID/channels/$INPUT_CHANNEL/appcast.xml?platform=windows&arch=x64&type=exe"
            echo "WS_UPDATE_EDDSA_PUBLIC_KEY=$SPARKLE_PUBLIC_ED_KEY"
          } >> "$GITHUB_ENV"
          [ -n "$SPARKLE_PUBLIC_ED_KEY" ] || echo "::warning::No SPARKLE_PUBLIC_ED_KEY repository variable: this build cannot verify updates, so it will not install any."
          if [ "$HAS_SPARKLE_KEY" = true ] && [ -z "$SPARKLE_PUBLIC_ED_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is set but SPARKLE_PUBLIC_ED_KEY is not: the app would not trust its own updates"; exit 1
          fi
          echo "edsig=$HAS_SPARKLE_KEY" >> "$GITHUB_OUTPUT"
          if [ "$HAS_PFX" = true ]; then mode=pfx; elif [ "$HAS_AZURE" = true ]; then mode=azure; else mode=none; fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          if [ "$mode" = none ]; then
            echo "::warning::Not Authenticode-signed (no WINDOWS_CERTIFICATE_PFX or AZURE_* signing settings): SmartScreen warns, and the build is for the beta channel only."
            [ "$INPUT_CHANNEL" != stable ] || { echo "::error::The stable channel takes only Authenticode-signed builds"; exit 1; }
          else
            echo "Authenticode signing: $mode"
          fi

      - name: WinSparkle ${{ env.WINSPARKLE_VERSION }}
        working-directory: C:/oo
        run: |
          curl -fsSL -o winsparkle.zip "https://github.com/vslavik/winsparkle/releases/download/v$WINSPARKLE_VERSION/WinSparkle-$WINSPARKLE_VERSION.zip"
          echo "$WINSPARKLE_SHA256  winsparkle.zip" | sha256sum -c -
          rm -rf winsparkle && mkdir winsparkle && unzip -q winsparkle.zip -d winsparkle
          dir="C:/oo/winsparkle/WinSparkle-$WINSPARKLE_VERSION"
          test -f "$dir/include/winsparkle.h" && test -f "$dir/x64/Release/WinSparkle.dll"
          echo "WINSPARKLE_DIR=$dir" >> "$GITHUB_ENV"

      - name: Tools (Qt 5.15, Inno Setup, grunt)
        run: |
          python -m pip install aqtinstall
          python -m aqt install-qt windows desktop 5.15.2 win64_msvc2019_64 -O C:/Qt
          ls C:/Qt/5.15.2
          choco install innosetup -y --no-progress
          npm install -g grunt-cli

      - name: Fetch sources
        working-directory: C:/oo
        run: |
          git clone --depth 1 -b "$BUILD_TOOLS_REF" https://github.com/ONLYOFFICE/build_tools.git
          # Pinned, not just named: `-b` follows a branch head, and build/v10/prepare.sh patches
          # build_tools by matching exact source text. When the head moves the patches stop
          # applying and the build dies in `prepare`, which is what `master` did here.
          git -C build_tools fetch --depth 1 origin "$BUILD_TOOLS_SHA"
          git -C build_tools checkout --detach "$BUILD_TOOLS_SHA"
          [ -n "$REUSE_BUILD_RUN" ] || for r in core sdkjs sdkjs-forms web-apps dictionaries core-fonts desktop-sdk document-templates; do
            git clone --depth 1 -b "$OO_TAG" --recurse-submodules --shallow-submodules "https://github.com/ONLYOFFICE/$r.git"
          done
          [ -n "$REUSE_BUILD_RUN" ] || git clone --depth 1 https://github.com/ONLYOFFICE/onlyoffice.github.io.git
          git clone --depth 1 https://github.com/Livezen-Technologies/worksuite-office-desktop-apps.git desktop-apps
          git -C desktop-apps fetch --depth 1 origin "$DESKTOP_APPS_REF"
          git -C desktop-apps checkout --detach "$DESKTOP_APPS_REF"

      - name: Prepare v10 sources for build_tools 9.4
        if: env.REUSE_BUILD_RUN == ''
        working-directory: C:/oo
        run: bash "$GITHUB_WORKSPACE/worksuite-office/build/v10/prepare.sh" "$GITHUB_WORKSPACE/worksuite-office"

      # build_tools 9.4 and v10's boost.pri name everything vc142: add VS 2019's toolset (v142) to VS 2022
      - name: VS 2019 toolset (v142)
        if: env.REUSE_BUILD_RUN == ''
        shell: pwsh
        run: |
          $installer = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          $p = Start-Process -Wait -PassThru -FilePath $installer -ArgumentList @('modify', '--installPath', "`"$vs`"",
            '--add', 'Microsoft.VisualStudio.Component.VC.v142.x86.x64', '--add', 'Microsoft.VisualStudio.Component.VC.v142.ATL', '--add', 'Microsoft.VisualStudio.Component.VC.14.29.16.11.ATL',
            '--quiet', '--norestart', '--nocache')
          Get-ChildItem "$vs\VC\Tools\MSVC" | Select-Object Name
          # the app (taskdialogtheme.cpp) needs ATL for the v142 toolset: stop here, not two hours later
          $atl = Get-ChildItem "$vs\VC\Tools\MSVC\14.29.*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue
          if (-not $atl) { Write-Error "ATL for v142 (atlbase.h) is not installed"; exit 1 }
          $atl.FullName

      # Boost's bootstrap and the qmake builds expect cl.exe (the v142 one) and the SDK on PATH
      - if: env.REUSE_BUILD_RUN == ''
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
          toolset: '14.29'

      - name: Build core, editors and app (build_tools)
        if: env.REUSE_BUILD_RUN == ''
        working-directory: C:/oo/build_tools
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          # V8 8.9's vs_toolchain.py looks for VS 2019/2017 by folder; this VS 2022 has the 2019 toolset (v142)
          $env:vs2019_install = $vs
          python configure.py --module desktop --platform win_64 --update 0 --clean 0 `
            --qt-dir C:/Qt/5.15.2 --vs-version 2019 --vs-path "$vs\VC\Auxiliary\Build"
          Get-Content config
          python make.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Get-ChildItem out\win_64\onlyoffice\DesktopEditors | Select-Object -First 30
          if (-not (Test-Path "out\win_64\onlyoffice\DesktopEditors\editors\sdkjs-plugins\{B50BAEE2-4EAC-4298-9DD2-73CC3223FFFA}\config.json")) {
            Write-Error "Sinhala Tools is not in the editors"; exit 1
          }
          if (-not (Test-Path "out\win_64\onlyoffice\DesktopEditors\editors\sdkjs-plugins\{7A1E5C0D-3B2F-4D6A-9E81-5C4F2B7D0A11}\config.json")) {
            Write-Error "WorkSuite Local AI is not in the editors"; exit 1
          }
          Get-ChildItem out\win_64\onlyoffice\DesktopEditors\fonts\worksuite-sinhala | Select-Object Name

      - name: Keep the compiled app
        if: env.REUSE_BUILD_RUN == ''
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-output
          path: C:/oo/build_tools/out/win_64/onlyoffice/DesktopEditors
          retention-days: 7

      - name: The compiled app from run ${{ env.REUSE_BUILD_RUN }}
        if: env.REUSE_BUILD_RUN != ''
        uses: actions/download-artifact@v4
        with:
          name: windows-build-output
          run-id: ${{ env.REUSE_BUILD_RUN }}
          github-token: ${{ github.token }}
          path: C:/oo/build_tools/out/win_64/onlyoffice/DesktopEditors

      - name: WinSparkle beside the app
        run: cp -fv "$WINSPARKLE_DIR/x64/Release/WinSparkle.dll" C:/oo/build_tools/out/win_64/onlyoffice/DesktopEditors/

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Local AI service (worksuite-ai.exe) in the install dir
        run: bash worksuite-office/build/v10/ai-service.sh "$GITHUB_WORKSPACE/worksuite-office" C:/oo/build_tools/out/win_64/onlyoffice/DesktopEditors

      - name: Sign the app (Authenticode, certificate)
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\worksuite-office\build\v10\sign-windows.ps1" -Path C:\oo\build_tools\out\win_64\onlyoffice\DesktopEditors -Recurse'

      - name: Sign the app (Authenticode, Azure Trusted Signing)
        if: steps.signing.outputs.mode == 'azure'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: C:\oo\build_tools\out\win_64\onlyoffice\DesktopEditors
          files-folder-filter: exe
          files-folder-recurse: true
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Package (Inno Setup, standalone)
        working-directory: C:/oo/desktop-apps/package
        shell: pwsh
        run: |
          $v = "$env:PRODUCT_VERSION.$env:BUILD_NUMBER"
          .\make.ps1 -Version $v -Arch x64 -Target standalone -CompanyName WorkSuite -ProductName DesktopEditors
          $env:INNOPATH = "${env:ProgramFiles(x86)}\Inno Setup 6"
          # common.iss lists languages whose .isl files Inno Setup ships only as "unofficial" translations
          $langs = "$env:INNOPATH\Languages"
          $list = Invoke-RestMethod https://api.github.com/repos/jrsoftware/issrc/contents/Files/Languages/Unofficial
          foreach ($f in $list) {
            if ($f.name -match '\.islu?$' -and -not (Test-Path "$langs\$($f.name)")) {
              Invoke-WebRequest $f.download_url -OutFile "$langs\$($f.name)"
            }
          }
          # any still missing falls back to English, rather than stopping the installer build
          Select-String -Path inno\common.iss -Pattern 'Languages\\([A-Za-z]+\.islu?)\b' -AllMatches |
            ForEach-Object { $_.Matches } | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique |
            ForEach-Object {
              if (-not (Test-Path "$langs\$_")) {
                Write-Host "::warning::no Inno Setup translation $_; using English"
                Copy-Item "$env:INNOPATH\Default.isl" "$langs\$_"
              }
            }
          .\make_inno.ps1 -Version $v -Arch x64 -Target standalone -CompanyName WorkSuite -ProductName DesktopEditors
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem inno\*.exe | ForEach-Object {
            Copy-Item $_.FullName "out\WorkSuite-Office-Standalone-$env:PRODUCT_VERSION-x64.exe"
          }
          Get-ChildItem out

      - name: Sign the installer (Authenticode, certificate)
        if: steps.signing.outputs.mode == 'pfx'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: '& "$env:GITHUB_WORKSPACE\worksuite-office\build\v10\sign-windows.ps1" -Path C:\oo\desktop-apps\package\out'

      - name: Sign the installer (Authenticode, Azure Trusted Signing)
        if: steps.signing.outputs.mode == 'azure'
        uses: azure/trusted-signing-action@v0.5.1
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: C:\oo\desktop-apps\package\out
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      # last: the Authenticode signature above changes the installer's bytes
      - name: Sign the installer for WinSparkle
        if: steps.signing.outputs.edsig == 'true'
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          SPARKLE_PUBLIC_ED_KEY: ${{ vars.SPARKLE_PUBLIC_ED_KEY }}
        run: node "$GITHUB_WORKSPACE/worksuite-office/build/sign-edsig.mjs" C:/oo/desktop-apps/package/out/*.exe

      - name: Summary
        env:
          MODE: ${{ steps.signing.outputs.mode }}
        run: |
          {
            echo "### WorkSuite Office $PRODUCT_VERSION ($BUILD_NUMBER), Windows x64"
            echo "- Updates from: \`$WS_UPDATE_APPCAST_URL\` (WinSparkle $WINSPARKLE_VERSION)"
            if [ "$MODE" = none ]; then echo "- Not Authenticode-signed (beta channel only)."; else echo "- Authenticode-signed ($MODE)."; fi
            if ls C:/oo/desktop-apps/package/out/*.edsig >/dev/null 2>&1; then
              echo "- Signed for WinSparkle (\`.edsig\` beside the installer)."
            else
              echo "- Not signed for WinSparkle (no SPARKLE_ED_PRIVATE_KEY secret): installed copies will not take it as an update."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-packages-x64
          path: |
            C:/oo/desktop-apps/package/out/*.exe
            C:/oo/desktop-apps/package/out/*.exe.edsig
          compression-level: 0

name: Build WorkSuite Office 10 (Linux x64)

# The 10.0 Linux build: ONLYOFFICE's v10 sources built with ONLYOFFICE's public build_tools (9.4),
# patched by build/v10/prepare.sh, and packaged by desktop-apps/package with WorkSuite's names.
# The 9.3 Linux build (Euro-Office) is build.yml.
#
# No sysroot for now: V8's host tools would not link against build_tools' Ubuntu 16 sysroot, so the
# app is built against this runner's Ubuntu 22.04 libraries and needs glibc 2.35 (Ubuntu 22.04,
# Debian 12) or newer.

on:
  # a new workflow can only be dispatched once it is on the default branch: until then, pushes to office-v10 run it
  push:
    branches: [office-v10]
    paths: ['.github/workflows/build-linux-v10.yml', 'build/v10/**', 'sinhala/**', 'ai-service/**', 'ai-plugin/**']
  workflow_dispatch:
    inputs:
      build_number:
        description: Build number; empty means 1000 + this workflow's run number.
        required: false
        default: ''

env:
  OO_TAG: v10.0.0.176
  BUILD_TOOLS_REF: release/v9.4.0
  BUILD_TOOLS_SHA: cf4cac0846d03e2e00a6fec5d1ecd4e9463086d5
  DESKTOP_APPS_REF: a018c25725aafa0fb93b6a84670b9981e1a205b1
  PRODUCT_VERSION: 10.1.6
  # depot_tools (V8) stays at the pinned commit: its self-update collides with build_tools' bootstrap edits
  DEPOT_TOOLS_UPDATE: '0'

jobs:
  build-linux-x64:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          path: worksuite-office

      - name: Build number
        env:
          INPUT_BUILD: ${{ inputs.build_number }}
        run: echo "BUILD_NUMBER=${INPUT_BUILD:-$((1000 + GITHUB_RUN_NUMBER))}" >> "$GITHUB_ENV"

      - name: Fetch sources
        run: |
          mkdir oo && cd oo
          git clone --depth 1 -b "$BUILD_TOOLS_REF" https://github.com/ONLYOFFICE/build_tools.git
          # Pinned, not just named: `-b` follows a branch head, and build/v10/prepare.sh patches
          # build_tools by matching exact source text. When the head moves the patches stop
          # applying and the build dies in `prepare`, which is what `master` did here.
          git -C build_tools fetch --depth 1 origin "$BUILD_TOOLS_SHA"
          git -C build_tools checkout --detach "$BUILD_TOOLS_SHA"
          for r in core sdkjs sdkjs-forms web-apps dictionaries core-fonts desktop-sdk document-templates; do
            git clone --depth 1 -b "$OO_TAG" --recurse-submodules --shallow-submodules "https://github.com/ONLYOFFICE/$r.git"
          done
          git clone --depth 1 https://github.com/ONLYOFFICE/onlyoffice.github.io.git
          git clone --depth 1 https://github.com/Livezen-Technologies/worksuite-office-desktop-apps.git desktop-apps
          git -C desktop-apps fetch --depth 1 origin "$DESKTOP_APPS_REF"
          git -C desktop-apps checkout --detach "$DESKTOP_APPS_REF"

      - name: Toolchain (ONLYOFFICE tools/linux)
        working-directory: oo/build_tools/tools/linux
        run: |
          ./python.sh
          # the runner image already has a global grunt (deps.py's npm install -g stops on it) and
          # libunwind-14-dev, which keeps libgstreamer1.0-dev's libunwind-dev out
          sudo rm -f /usr/local/bin/grunt
          sudo apt-get remove -y libunwind-14-dev || true
          sudo apt-get install -y libunwind-dev
          ./python3/bin/python3 ./deps.py
          sudo ./cmake.sh
          ./python3/bin/python3 ./qt_binary_fetch.py all
          ls qt_build

      - name: Prepare v10 sources for build_tools 9.4
        working-directory: oo
        run: bash ../worksuite-office/build/v10/prepare.sh "$GITHUB_WORKSPACE/worksuite-office"

      - name: Build core, editors and app (build_tools)
        working-directory: oo/build_tools
        run: |
          py=./tools/linux/python3/bin/python
          $py configure.py --module desktop --platform linux_64 --update 0 --clean 0 --sysroot 0 \
            --qt-dir "$PWD/tools/linux/qt_build/Qt-5.9.9"
          cat config
          $py make.py
          ls -la out/linux_64/onlyoffice/desktopeditors
          test -f "out/linux_64/onlyoffice/desktopeditors/editors/sdkjs-plugins/{B50BAEE2-4EAC-4298-9DD2-73CC3223FFFA}/config.json" || { echo "::error::Sinhala Tools is not in the editors"; exit 1; }
          test -f "out/linux_64/onlyoffice/desktopeditors/editors/sdkjs-plugins/{7A1E5C0D-3B2F-4D6A-9E81-5C4F2B7D0A11}/config.json" || { echo "::error::WorkSuite Local AI is not in the editors"; exit 1; }
          ls out/linux_64/onlyoffice/desktopeditors/fonts/worksuite-sinhala

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Local AI service (worksuite-ai) next to the app
        run: bash worksuite-office/build/v10/ai-service.sh "$GITHUB_WORKSPACE/worksuite-office" "$GITHUB_WORKSPACE/oo/build_tools/out/linux_64/onlyoffice/desktopeditors"

      - name: Package (deb, rpm, tar)
        working-directory: oo/desktop-apps/package
        run: |
          sudo apt-get install -y rpm m4 fakeroot dpkg-dev debhelper
          # dpkg-deb on Ubuntu 22.04 has no --threads-max (debian/rules passes it)
          grep -rl -- '--threads-max' deb rpm rpm-suse 2>/dev/null | xargs -r sed -i 's/ --threads-max=[^ ]*//'
          make clean
          vars=(COMPANY_NAME=WorkSuite PRODUCT_NAME=Office
                PUBLISHER_NAME="Livezen Technologies LLC" PUBLISHER_URL=https://worksuitecloud.com
                SUPPORT_URL=https://worksuitecloud.com SUPPORT_MAIL=support@worksuitecloud.com
                PRODUCT_VERSION="$PRODUCT_VERSION" BUILD_NUMBER="$BUILD_NUMBER")
          # each package type on its own, so one that fails does not take the others with it
          failed=""
          for t in deb rpm tar; do make "$t" "${vars[@]}" || failed="$failed $t"; done
          find deb rpm tar -maxdepth 4 -type f \( -name '*.deb' -o -name '*.rpm' -o -name '*.tar.xz' \) -exec ls -la {} +
          [ -z "$failed" ] || echo "::warning::package types that failed:$failed"
          ls deb/*.deb >/dev/null 2>&1 || { echo "::error::no .deb was made"; exit 1; }
          for d in deb/*.deb; do dpkg-deb -c "$d" | grep -q '/worksuite-ai$' || { echo "::error::$d has no worksuite-ai"; exit 1; }; done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-packages-amd64
          if-no-files-found: ignore
          path: |
            oo/desktop-apps/package/deb/*.deb
            oo/desktop-apps/package/rpm/build/RPMS/*/*.rpm
            oo/desktop-apps/package/tar/*.tar.xz
          compression-level: 0

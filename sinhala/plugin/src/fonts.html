<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Sinhala font</title>
  <link rel="stylesheet" href="../v1/plugins.css" />
  <link rel="stylesheet" href="resources/legacy.css" />
  <script type="text/javascript" src="../v1/plugins.js"></script>
  <script type="text/javascript" src="../v1/plugins-ui.js"></script>
  <script type="text/javascript" src="scripts/sinhala-core.js"></script>
  <script type="text/javascript" src="scripts/fonts.js"></script>
</head>
<body>
  <form class="lg" id="form" novalidate>
    <input id="search" class="lg-search" type="search" autocomplete="off" data-tr-placeholder="Search fonts" placeholder="Search fonts" />
    <div id="list" class="lg-list" role="listbox" aria-label="Sinhala font"></div>
    <div class="lg-field">
      <span data-tr="Preview">Preview</span>
      <div id="preview" class="lg-preview"></div>
      <div id="status" class="lg-status" aria-live="polite"></div>
    </div>
    <div class="lg-actions">
      <button type="button" id="cancel" class="lg-btn" data-tr="Cancel">Cancel</button>
      <button type="submit" id="apply" class="lg-btn lg-primary" data-tr="Use font">Use font</button>
    </div>
  </form>
</body>
</html>

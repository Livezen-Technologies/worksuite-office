<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkSuite Project</title>
<link rel="stylesheet" href="editor.css">
</head>
<body>
<div class="wp-app">
  <nav class="wp-tabs" role="tablist">
    <button class="wp-tab" data-tab="file">File</button>
    <button class="wp-tab is-on" data-tab="task">Task</button>
    <button class="wp-tab" data-tab="resource">Resource</button>
    <button class="wp-tab" data-tab="project">Project</button>
    <button class="wp-tab" data-tab="view">View</button>
    <span class="wp-title" id="wp-title"></span>
    <span class="wp-mode" id="wp-mode" role="status" hidden><span id="wp-mode-text">Read-only</span> · <button type="button" id="wp-upgrade">Upgrade to Pro</button><button type="button" id="wp-retry" hidden>Try again</button></span>
  </nav>
  <div class="wp-ribbon" id="wp-ribbon">
    <div class="wp-group rb-group" data-tab="file">
      <button class="big" data-icon="new" data-cmd="new">New</button><button class="big" data-icon="open" data-cmd="open">Open</button><button class="big" data-icon="save" data-cmd="save">Save</button>
      <span class="rb-glabel">File</span>
    </div>
    <div class="wp-group rb-group" data-tab="file">
      <button class="big" data-icon="outline" data-cmd="fromOutline" data-edit>From outline</button><button class="big" data-icon="ai" data-cmd="aiPlan" data-edit>Draft with AI</button>
      <span class="rb-glabel">Start a plan</span>
    </div>
    <div class="wp-group rb-group" data-tab="file">
      <div class="rb-stack"><button data-icon="export" data-cmd="exportXml">Project XML</button><button data-icon="table" data-cmd="exportXlsx">Excel (XLSX)</button><button data-icon="export" data-cmd="exportCsv">CSV</button></div>
      <button class="big" data-icon="print" data-cmd="print">Print / PDF</button>
      <span class="rb-glabel">Export and print</span>
    </div>
    <div class="wp-group rb-group" data-tab="task">
      <button class="big" data-icon="gantt" data-cmd="viewGantt">Gantt Chart</button>
      <div class="rb-stack"><button data-icon="board" data-cmd="viewBoard">Task Board</button><button data-icon="calendar" data-cmd="viewCal">Calendar</button></div>
      <span class="rb-glabel">View</span>
    </div>
    <div class="wp-group rb-group" data-tab="task">
      <div class="rb-stack"><button data-icon="undo" data-cmd="undo" data-edit>Undo</button><button data-icon="redo" data-cmd="redo" data-edit>Redo</button></div>
      <span class="rb-glabel">History</span>
    </div>
    <div class="wp-group rb-group" data-tab="task">
      <div class="rb-stack"><button data-icon="p0" data-cmd="p0" data-edit>0% complete</button><button data-icon="p50" data-cmd="p50" data-edit>50% complete</button><button data-icon="p100" data-cmd="p100" data-edit>100% complete</button>
      <button data-icon="outdent" data-cmd="outdent" data-edit>Outdent</button><button data-icon="indent" data-cmd="indent" data-edit>Indent</button></div>
      <div class="rb-stack"><button data-icon="link" data-cmd="link" data-edit>Link tasks</button><button data-icon="unlink" data-cmd="unlink" data-edit>Unlink tasks</button></div>
      <span class="rb-glabel">Schedule</span>
    </div>
    <div class="wp-group rb-group" data-tab="task">
      <div class="rb-stack"><label class="rb-field">Type <select id="wp-type" title="Which of duration, work and people stays as it is when another changes"><option value="fixedUnits">Fixed units</option><option value="fixedWork">Fixed work</option><option value="fixedDuration">Fixed duration</option></select></label><label class="rb-field" title="Adding people shortens the task: the same work, shared"><input type="checkbox" id="wp-effort"> Effort driven</label></div>
      <span class="rb-glabel">Task type</span>
    </div>
    <div class="wp-group rb-group" data-tab="task">
      <button class="big" data-icon="schedule" data-cmd="autoSchedule" data-edit>Auto Schedule</button>
      <span class="rb-glabel">Tasks</span>
    </div>
    <div class="wp-group rb-group" data-tab="task">
      <button class="big" data-icon="task" data-cmd="addTask" data-edit>Task</button><button class="big" data-icon="milestone" data-cmd="addMilestone" data-edit>Milestone</button><button class="big" data-icon="recurring" data-cmd="addRecurring" data-edit>Recurring</button>
      <div class="rb-stack"><button data-icon="remove" data-cmd="remove" data-edit>Delete</button><button data-icon="inactive" data-cmd="inactive" data-edit title="Keep in the plan but leave out of the schedule">Inactivate</button></div>
      <span class="rb-glabel">Insert</span>
    </div>
    <div class="wp-group rb-group" data-tab="task">
      <button class="big" data-icon="today" data-cmd="today">Scroll to Today</button>
      <span class="rb-glabel">Editing</span>
    </div>
    <div class="wp-group rb-group" data-tab="resource">
      <button class="big" data-icon="team" data-cmd="viewSheet">Resource Sheet</button><button class="big" data-icon="workload" data-cmd="viewWorkload">Workload</button><button class="big" data-icon="gantt" data-cmd="viewGantt">Gantt Chart</button>
      <span class="rb-glabel">View</span>
    </div>
    <div class="wp-group rb-group" data-tab="resource">
      <button class="big" data-icon="level" data-cmd="levelAll" data-edit title="Delay lower-priority tasks so nobody is over-allocated">Level All</button>
      <div class="rb-stack"><button data-icon="undo" data-cmd="clearLevel" data-edit>Clear Levelling</button></div>
      <span class="rb-glabel">Level</span>
    </div>
    <div class="wp-group rb-group" data-tab="resource">
      <div class="rb-stack"><span class="rb-field" id="wp-team-hint">Assign people in the Owner column</span><span class="rb-field">“Priya 50%” is half time</span><span class="rb-field">Rates: Resource Sheet</span></div>
      <span class="rb-glabel">Assignments</span>
    </div>
    <div class="wp-group rb-group" data-tab="project">
      <div class="rb-stack"><label class="rb-field">Calendar <select id="wp-cal"><option value="standard">Standard (Mon–Fri)</option><option value="lk">Sri Lanka (public holidays)</option></select></label></div>
      <span class="rb-glabel">Properties</span>
    </div>
    <div class="wp-group rb-group" data-tab="project">
      <button class="big" data-icon="schedule" data-cmd="autoSchedule" data-edit>Schedule Now</button>
      <div class="rb-stack"><label class="rb-field"><input type="checkbox" id="wp-critical"> Critical path</label></div>
      <span class="rb-glabel">Schedule</span>
    </div>
    <div class="wp-group rb-group" data-tab="project">
      <button class="big" data-icon="baseline" data-cmd="saveBaseline" data-edit>Set Baseline</button><button class="big" data-icon="money" data-cmd="viewEv">Earned Value</button>
      <div class="rb-stack"><label class="rb-field"><input type="checkbox" id="wp-baseline"> Show baseline</label></div>
      <span class="rb-glabel">Baseline</span>
    </div>
    <div class="wp-group rb-group" data-tab="project">
      <div class="rb-stack"><label class="rb-field">Status date <input type="date" id="wp-status-date" data-edit></label></div>
      <span class="rb-glabel">Status</span>
    </div>
    <div class="wp-group rb-group" data-tab="view">
      <button class="big" data-icon="gantt" data-cmd="viewGantt">Gantt Chart</button><button class="big" data-icon="workload" data-cmd="viewWorkload">Workload</button><button class="big" data-icon="board" data-cmd="viewBoard">Task Board</button><button class="big" data-icon="calendar" data-cmd="viewCal">Calendar</button><button class="big" data-icon="network" data-cmd="viewNet">Network Diagram</button><button class="big" data-icon="gantt" data-cmd="viewTaskUsage">Task Usage</button><button class="big" data-icon="workload" data-cmd="viewResUsage">Resource Usage</button><button class="big" data-icon="calendar" data-cmd="viewTimeline">Timeline</button><button class="big" data-icon="team" data-cmd="viewSheet">Resource Sheet</button><button class="big" data-icon="money" data-cmd="viewEv">Earned Value</button>
      <span class="rb-glabel">Views</span>
    </div>
    <div class="wp-group rb-group" data-tab="view">
      <div class="rb-stack"><label class="rb-field">Filter <select id="wp-filter" title="Show only some tasks"></select></label><label class="rb-field">Group by <select id="wp-group" title="Show tasks under headings"></select></label><button data-icon="remove" id="wp-filter-on" data-cmd="clearFilter" hidden>Clear filter</button></div>
      <span class="rb-glabel">Data</span>
    </div>
    <div class="wp-group rb-group" data-tab="view">
      <div class="rb-stack"><label class="rb-field">Timescale <select id="wp-zoom"><option value="day">Days</option><option value="week" selected>Weeks</option><option value="month">Months</option><option value="quarter">Quarters</option></select></label></div>
      <button class="big" data-icon="today" data-cmd="today">Today</button>
      <span class="rb-glabel">Zoom</span>
    </div>
  </div>
  <main class="wp-main">
    <section class="wp-grid" id="wp-grid" tabindex="0" aria-label="Tasks"></section>
    <div class="wp-split" aria-hidden="true"></div>
    <section class="wp-chart" id="wp-chart" aria-label="Gantt chart"></section>
  </main>
  <footer class="wp-status" id="wp-status"></footer>
  <input type="file" id="wp-file" accept=".wsproj,.xml,.mpp,.json" hidden>
</div>
<script type="module" src="editor.js"></script>
</body>
</html>

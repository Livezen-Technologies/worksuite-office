<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WorkSuite Diagram</title>
<script src="../../common/theme.js"></script>
<script src="../../common/sinhala-core.js"></script>
<link rel="stylesheet" href="editor.css">
<link rel="stylesheet" href="../../common/office.css">
</head>
<body>
<div class="wd-app">
  <header class="os-header" id="wd-header">
    <div class="os-quick"><button type="button" data-cmd="save" data-icon="save" title="Save">Save</button><button type="button" data-cmd="print" data-icon="print" title="Print">Print</button><button type="button" data-cmd="undo" data-icon="undo" title="Undo">Undo</button><button type="button" data-cmd="redo" data-icon="redo" title="Redo">Redo</button></div>
    <span class="wd-title os-title" id="wd-title"></span>
    <div class="os-header-end"></div>
  </header>
  <nav class="wd-tabs">
    <button class="wd-tab" data-tab="file">File</button>
    <button class="wd-tab is-on" data-tab="home">Home</button>
    <button class="wd-tab" data-tab="insert">Insert</button>
    <button class="wd-tab" data-tab="design">Design</button>
    <button class="wd-tab" data-tab="arrange">Arrange</button>
    <button class="wd-tab" data-tab="review">Review</button>
    <button class="wd-tab" data-tab="view">View</button>
    <button class="wd-tab" data-tab="sinhala">Sinhala Tools</button>
    <span class="wd-mode" id="wd-mode" role="status" hidden><span id="wd-mode-text">Read-only</span> · <button type="button" id="wd-upgrade">Upgrade to Pro</button><button type="button" id="wd-retry" hidden>Try again</button></span>
  </nav>
  <div class="wd-ribbon" id="wd-ribbon">
    <div class="wd-group rb-group" data-tab="file">
      <button class="big" data-icon="new" data-cmd="new">New</button><button class="big" data-icon="template" data-cmd="fromTemplate" data-edit title="Add a page from a template: flowcharts, BPMN, org charts, UML, ERD, network, mind map, timeline">From Template</button><button class="big" data-icon="open" data-cmd="open">Open</button><button class="big" data-icon="save" data-cmd="save">Save</button>
      <span class="rb-glabel">File</span>
    </div>
    <div class="wd-group rb-group" data-tab="file">
      <div class="rb-stack"><button data-icon="export" data-cmd="exportVsdx">Visio (VSDX)</button><button data-icon="export" data-cmd="exportVstx" title="A Visio template: Visio starts new drawings from it">Visio template (VSTX)</button><button data-icon="export" data-cmd="saveStencil" title="My shapes as a Visio stencil">Stencil (VSSX)</button><button data-icon="export" data-cmd="exportPng">Picture (PNG)</button><button data-icon="export" data-cmd="exportSvg">Vector (SVG)</button></div>
      <button class="big" data-icon="print" data-cmd="print">Print / PDF</button>
      <span class="rb-glabel">Export and print</span>
    </div>
    <div class="wd-group rb-group" data-tab="home">
      <div class="rb-stack"><button data-icon="undo" data-cmd="undo" data-edit>Undo</button><button data-icon="redo" data-cmd="redo" data-edit>Redo</button></div>
      <span class="rb-glabel">History</span>
    </div>
    <div class="wd-group rb-group" data-tab="home">
      <div class="rb-stack"><button data-icon="duplicate" data-cmd="duplicate" data-edit>Duplicate</button><button data-icon="remove" data-cmd="remove" data-edit>Delete</button></div>
      <span class="rb-glabel">Clipboard</span>
    </div>
    <div class="wd-group rb-group" data-tab="home">
      <button class="big is-on" data-icon="pointer" data-tool="select">Pointer Tool</button><button class="big" data-icon="connector" data-tool="connect" data-edit>Connector</button>
      <div class="rb-stack"><label class="rb-field">Lines <select id="wd-route" data-edit title="Connector style"><option value="elbow">Elbow</option><option value="straight">Straight</option><option value="curved">Curved</option></select></label></div>
      <span class="rb-glabel">Tools</span>
    </div>
    <div class="wd-group rb-group" data-tab="home">
      <div class="rb-stack"><button data-icon="alignleft" data-cmd="alignLeft" data-edit>Align left</button><button data-icon="aligncenter" data-cmd="alignCenter" data-edit>Align centre</button><button data-icon="aligntop" data-cmd="alignTop" data-edit>Align top</button></div>
      <button class="big" data-icon="autoalign" data-cmd="autoAlign" data-edit title="Straighten the lines between connected shapes and even out the gaps (the selected shapes, or the whole page)">Auto Align &amp; Space</button>
      <div class="rb-stack"><button data-icon="front" data-cmd="front" data-edit>Bring to front</button><button data-icon="back" data-cmd="back" data-edit>Send to back</button><button data-icon="group" data-cmd="group" data-edit>Group</button></div>
      <span class="rb-glabel">Arrange</span>
    </div>
    <div class="wd-group rb-group" data-tab="insert">
      <button class="big" data-icon="table" data-cmd="fromTable" data-edit>From Table</button><button class="big" data-icon="ai" data-cmd="aiDiagram" data-edit>Draft with AI</button>
      <span class="rb-glabel">Diagram</span>
    </div>
    <div class="wd-group rb-group" data-tab="insert">
      <button class="big" data-icon="table" data-cmd="swimlanes" data-edit title="A cross-functional flowchart: a lane per team or role">Swimlanes</button>
      <div class="rb-stack"><button data-icon="table" data-cmd="addLane" data-edit>Add lane</button></div>
      <span class="rb-glabel">Cross-functional</span>
    </div>
    <div class="wd-group rb-group" data-tab="insert">
      <button class="big" data-icon="group" data-cmd="addContainer" data-edit title="A titled box around the selected shapes">Container</button><button class="big" data-icon="list" data-cmd="addList" data-edit title="A column that keeps its shapes in order">List</button>
      <div class="rb-stack"><button data-icon="table" data-cmd="addCallout" data-edit title="A note pointing at the selected shape">Callout</button><button data-icon="list" data-cmd="addToStencil" data-edit title="Keep copies of the selected shapes in My shapes, to use again">Add to My shapes</button><button data-icon="open" data-cmd="openStencil" data-edit title="Open a Visio stencil (.vssx) as My shapes">Open stencil</button></div>
      <span class="rb-glabel">Diagram parts</span>
    </div>
    <div class="wd-group rb-group" data-tab="insert">
      <button class="big" data-icon="table" data-cmd="linkData" data-edit title="Bring a CSV or Excel table's rows into the shapes' data">Link Data</button><button class="big" data-icon="table" data-cmd="dataGraphics" data-edit title="Colour shapes, add icons or bars by their shape data">Data Graphics</button>
      <div class="rb-stack"><button data-icon="redo" data-cmd="refreshData" data-edit title="Apply a newer copy of the linked table">Refresh data</button><button data-icon="remove" data-cmd="clearGraphics" data-edit>Remove graphics</button></div>
      <span class="rb-glabel">Data</span>
    </div>
    <div class="wd-group rb-group" data-tab="insert">
      <button class="big" data-icon="connector" data-tool="connect" data-edit>Connector</button>
      <span class="rb-glabel">Diagram parts</span>
    </div>
    <div class="wd-group rb-group" data-tab="arrange">
      <div class="rb-stack"><button data-icon="alignleft" data-cmd="alignLeft" data-edit>Align left</button><button data-icon="aligncenter" data-cmd="alignCenter" data-edit>Align centre</button><button data-icon="alignright" data-cmd="alignRight" data-edit>Align right</button></div>
      <div class="rb-stack"><button data-icon="aligntop" data-cmd="alignTop" data-edit>Align top</button><button data-icon="alignmiddle" data-cmd="alignMiddle" data-edit>Align middle</button><button data-icon="alignbottom" data-cmd="alignBottom" data-edit>Align bottom</button></div>
      <div class="rb-stack"><button data-icon="distribute" data-cmd="distributeH" data-edit title="Equal gaps across, between the outer two">Distribute across</button><button data-icon="distributev" data-cmd="distributeV" data-edit title="Equal gaps down, between the outer two">Distribute down</button></div>
      <button class="big" data-icon="autoalign" data-cmd="autoAlign" data-edit title="Straighten the lines between connected shapes and even out the gaps (the selected shapes, or the whole page)">Auto Align &amp; Space</button>
      <span class="rb-glabel">Align</span>
    </div>
    <div class="wd-group rb-group" data-tab="arrange">
      <button class="big" data-icon="layoutdown" data-cmd="layoutDown" data-edit title="Org charts and trees: top to bottom (the selected shapes, or the whole page; swimlanes keep their shapes)">Top to Bottom</button><button class="big" data-icon="layoutright" data-cmd="layoutRight" data-edit title="Flowcharts: left to right (the selected shapes, or the whole page; swimlanes keep their shapes)">Left to Right</button>
      <span class="rb-glabel">Layout</span>
    </div>
    <div class="wd-group rb-group" data-tab="arrange">
      <div class="rb-stack"><button data-icon="front" data-cmd="front" data-edit>Bring to front</button><button data-icon="back" data-cmd="back" data-edit>Send to back</button></div>
      <div class="rb-stack"><button data-icon="group" data-cmd="group" data-edit>Group</button><button data-icon="ungroup" data-cmd="ungroup" data-edit>Ungroup</button></div>
      <span class="rb-glabel">Arrange</span>
    </div>
    <div class="wd-group rb-group" data-tab="design">
      <button class="big" data-icon="theme" data-cmd="designTheme" data-edit title="Colours for the shapes and lines, for this page or all pages">Theme</button>
      <span class="rb-glabel">Themes</span>
    </div>
    <div class="wd-group rb-group" data-tab="design">
      <button class="big" data-icon="pageframe" data-cmd="designPage" data-edit title="A background colour, and a border with the page's title">Background &amp; Border</button>
      <button class="big" data-icon="ruler" data-cmd="drawingScale" data-edit title="For floor and site plans: what a length on the page stands for">Drawing Scale</button>
      <span class="rb-glabel">Page</span>
    </div>
    <div class="wd-group rb-group" data-tab="review">
      <button class="big" data-icon="check" data-cmd="checkDiagram" title="Check the page against the flowchart or BPMN rules">Check Diagram</button>
      <span class="rb-glabel">Validate</span>
    </div>
    <div class="wd-group rb-group" data-tab="review">
      <button class="big" data-icon="comment" data-cmd="newComment" data-edit title="Comment on the selected shape, or the page">New Comment</button>
      <button class="big" data-icon="comments" data-cmd="comments" title="Show or hide the comments">Comments</button>
      <span class="rb-glabel">Comments</span>
    </div>
    <div class="wd-group rb-group" data-tab="review">
      <button class="big" data-icon="report" data-cmd="shapeReport" title="A table of the shapes and their data, to CSV or Excel">Shape Report</button>
      <span class="rb-glabel">Reports</span>
    </div>
    <div class="wd-group rb-group" data-tab="sinhala">
      <button class="big" data-icon="text" id="wd-singlish" data-cmd="singlish" title="Type Sinhala in English letters: ammaa becomes අම්මා as you finish each word">Singlish Typing</button>
      <span class="rb-glabel">Typing</span>
    </div>
    <div class="wd-group rb-group" data-tab="sinhala">
      <div class="rb-stack"><label class="rb-field">Legacy font <select id="wd-si-font" data-latin title="The font the old text was typed in"></select></label></div>
      <button class="big" data-icon="update" data-cmd="siConvert" data-edit title="Convert the selected shapes' text from a legacy Sinhala font to Unicode">Convert to Unicode</button>
      <button class="big" data-icon="check" data-cmd="siFix" data-edit title="Put right badly formed Sinhala in the selected shapes' text">Fix Sinhala</button>
      <span class="rb-glabel">Text</span>
    </div>
    <div class="wd-group rb-group" data-tab="view">
      <div class="rb-stack"><label class="rb-field"><input type="checkbox" id="wd-grid" checked> Grid and snap</label><label class="rb-field"><input type="checkbox" id="wd-jumps" checked> Line jumps</label></div>
      <span class="rb-glabel">Show</span>
    </div>
    <div class="wd-group rb-group" data-tab="view">
      <button class="big" data-icon="fit" data-cmd="zoomFit">Fit to Window</button>
      <div class="rb-stack"><button data-icon="zoomin" data-cmd="zoomIn">Zoom in</button><button data-icon="zoomout" data-cmd="zoomOut">Zoom out</button><span class="rb-field" id="wd-zoomlabel">100%</span></div>
      <span class="rb-glabel">Zoom</span>
    </div>
  </div>
  <main class="wd-main">
    <aside class="wd-lib" id="wd-lib" aria-label="Shapes"></aside>
    <section class="wd-canvas-wrap">
      <div class="wd-canvas" id="wd-canvas" tabindex="0" aria-label="Diagram page"></div>
      <div class="wd-pages" id="wd-pages"></div>
    </section>
    <aside class="wd-props" id="wd-props" aria-label="Properties"></aside>
    <nav class="os-strip" id="wd-strip" aria-label="Settings"></nav>
  </main>
  <footer class="wd-status" id="wd-status"></footer>
  <input type="file" id="wd-stencil-file" accept=".vssx" hidden>
  <input type="file" id="wd-data-file" accept=".csv,.tsv,.txt,.xlsx" hidden>
  <input type="file" id="wd-file" accept=".wsdiagram,.vsdx,.vsdm,.vstx,.json" hidden>
</div>
<script type="module" src="editor.js"></script>
</body>
</html>
